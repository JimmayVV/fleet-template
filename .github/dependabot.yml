version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      build-tools:
        patterns: ["vite*", "typescript*", "oxlint*", "oxfmt*"]
      test-tools:
        patterns: ["vitest*", "@playwright/*", "playwright*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
