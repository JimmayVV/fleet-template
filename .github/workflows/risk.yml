name: Risk

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  risk:
    uses: JimmayVV/fleet-ci/.github/workflows/risk.yml@v1
    with:
      # Paths that always need a human. Edit for this project.
      high-paths: |
        convex/**
        **/auth/**
        **/billing/**
        **/checkout/**
  dependabot:
    uses: JimmayVV/fleet-ci/.github/workflows/dependabot-automerge.yml@v1
