name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: JimmayVV/fleet-ci/.github/workflows/node-ci.yml@v1
    with:
      package-manager: bun
      format-check: true
      playwright: false
